<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pearly đã chuyển nhà</title>
<noscript><meta http-equiv="refresh" content="0;url=https://littledua.github.io/pearly/"></noscript>
<link rel="canonical" href="https://littledua.github.io/pearly/">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#dff3f7;color:#24506a;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
a{color:#1f7a9c;font-weight:600}
</style>
</head>
<body>
<p>Pearly đã chuyển sang link mới.<br><a href="https://littledua.github.io/pearly/">Mở Pearly</a></p>
<script>
// Gỡ service worker cũ ở đường dẫn này (chỉ của /pinyaprinting/pearly/), rồi chuyển sang link mới.
(function(){
  var NEW='https://littledua.github.io/pearly/';
  var go=function(){location.replace(NEW)};
  var OLD='/pinyaprinting/pearly/';
  setTimeout(go,2500);
  // App mới dùng chung tên kho "pearly-*": chỉ xoá file thuộc đường dẫn cũ.
  var clean=!window.caches?Promise.resolve():caches.keys().then(function(ks){
    return Promise.all(ks.filter(function(k){return k.indexOf('pearly-')===0}).map(function(k){
      return caches.open(k).then(function(c){return c.keys().then(function(rs){
        return Promise.all(rs.filter(function(r){return new URL(r.url).pathname.indexOf(OLD)===0}).map(function(r){return c.delete(r)}));
      }).then(function(){return c.keys()}).then(function(rs){if(!rs.length) return caches.delete(k)})});
    }));
  });
  var unreg=!('serviceWorker' in navigator)?Promise.resolve():navigator.serviceWorker.getRegistrations().then(function(rs){
    return Promise.all(rs.filter(function(r){return r.scope.indexOf(OLD)>=0}).map(function(r){return r.unregister()}));
  });
  Promise.all([clean.catch(function(){}),unreg.catch(function(){})]).then(go);
})();
</script>
</body>
</html>
